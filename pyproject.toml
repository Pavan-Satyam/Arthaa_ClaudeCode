[project]
name = "arthaai"
version = "0.1.0"
description = "Zero-trust multi-agent LLM framework for equities & commodities analysis (blueprint implementation)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "qdrant-client>=1.12",
    "anthropic>=0.40",
    "langgraph>=0.2.40",
    "pybreaker>=1.2",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
embed = ["fastembed>=0.3"]
auth = ["pyjwt[crypto]>=2.8"]
obs = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
research = ["duckdb>=1.1", "statsmodels>=0.14"]
market-data = ["ccxt>=4.4", "exchange-calendars>=4.5"]
fundamentals = ["edgartools>=3.0"]
macro = ["pandas-datareader>=0.10", "rdbnomics>=2.0"]
news = ["feedparser>=6.0", "trafilatura>=1.8"]
sentiment = ["transformers>=4.40", "torch>=2.2"]
openbb = ["openbb>=4.0", "openbb-yfinance>=1.0"]
alternatives = ["pandas-datareader>=0.10", "QuantLib>=1.35", "planetary-computer>=1.0", "pystac-client>=0.7"]
execution = ["openai>=1.30", "nautilus_trader>=1.200", "alpaca-py>=0.30"]
dev = ["ruff>=0.6", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
arthaai = "arthaai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arthaai"]

[tool.ruff]
line-length = 100
target-version = "py312"
