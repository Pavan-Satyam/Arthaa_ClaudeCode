[project]
name = "arthaai"
version = "0.1.0"
description = "Zero-trust multi-agent LLM framework for equities & commodities analysis (blueprint implementation)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "qdrant-client>=1.12",
    "anthropic>=0.40",
    "langgraph>=0.2.40",
    "pybreaker>=1.2",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
embed = ["fastembed>=0.3"]
bedrock = ["boto3>=1.34"]
dev = ["ruff>=0.6", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
arthaai = "arthaai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arthaai"]

[tool.ruff]
line-length = 100
target-version = "py312"
